[project]
name = "clausewise"
version = "0.1.0"
description = "Open-source, MCP-native, state-aware contract explainer for employees and independent contractors."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "clausewise-core",
    "clausewise-corpus",
    "clausewise-mcp",
    "clausewise-evals",
    "clausewise-monitor",
    "clausewise-ft",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clausewise"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
clausewise-core = { workspace = true }
clausewise-corpus = { workspace = true }
clausewise-mcp = { workspace = true }
clausewise-evals = { workspace = true }
clausewise-monitor = { workspace = true }
clausewise-ft = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-q"
