[project]
name = "clausewise-monitor"
version = "0.1.0"
description = "ClauseWise law-change monitoring: deterministic collectors + human-gated updater."
requires-python = ">=3.12"
dependencies = ["clausewise-core", "clausewise-corpus"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
clausewise-core = { workspace = true }
clausewise-corpus = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/clausewise_monitor"]
