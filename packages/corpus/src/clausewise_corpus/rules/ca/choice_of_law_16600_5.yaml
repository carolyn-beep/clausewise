plain_summary: >
  A non-compete that is void under California law cannot be enforced against a California
  resident or employee, regardless of where or when the contract was signed, and even if the
  person worked outside California at the time. The law also creates a private right of
  action, so a worker can sue an employer that tries to enforce — or even includes — such a
  clause. The exact wording of subsection (a) is pending primary-source verification.
