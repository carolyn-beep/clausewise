plain_summary: >
  For someone who primarily works and lives in California, an employer generally cannot use a
  contract to force disputes into another state's courts, or to apply another state's law to
  claims arising in California. The main exception is when the employee was individually
  represented by their own lawyer in negotiating the agreement. A worker can void an offending
  provision, keep the dispute in California under California law, and may recover attorney's
  fees.
