plain_summary: >
  California employers must notify current employees — and certain former employees — in
  writing that any non-compete clause they signed is void. Employers were required to send
  that individualized notice by February 14, 2024. This is a separate notice obligation: it
  does not make a void non-compete enforceable, but a failure to notify can itself be a
  violation.
