plain_summary: >
  California presumes a worker is an employee, not an independent contractor, unless the hiring
  entity proves all three parts of the "ABC" test: (A) the worker is free from the hiring
  entity's control and direction in fact and under the contract; (B) the work is outside the
  usual course of the hiring entity's business; and (C) the worker is customarily engaged in an
  independently established trade, occupation, or business of the same kind. A number of
  occupations have statutory exceptions. Being misclassified as a contractor can mean losing
  minimum-wage, overtime, and other employee protections.
