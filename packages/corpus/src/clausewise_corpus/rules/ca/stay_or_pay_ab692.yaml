plain_summary: >
  California bans most "stay-or-pay" clauses — terms that require a worker to repay the
  employer (for training, a signing bonus, relocation costs, and the like) if they leave
  before a set date — in contracts entered into on or after January 1, 2026. Workers have a
  private right of action, with statutory damages starting at $5,000. Narrow exceptions exist,
  such as certain genuine tuition-repayment arrangements for transferable credentials.
