plain_summary: >
  A California invention-assignment agreement cannot require a worker to assign inventions they
  developed entirely on their own time without using the employer's equipment, supplies,
  facilities, or trade-secret information — unless the invention either relates to the
  employer's business or actual or anticipated research and development, or results from work
  the worker performed for the employer. Employers must give written notice of these limits,
  and a clause that tries to assign more is unenforceable to that extent.
