plain_summary: >
  When a California employer discharges a worker, all earned and unpaid wages are generally due
  immediately at the time of termination. A worker who quits without notice is generally owed
  final wages within 72 hours; a worker who gives at least 72 hours' notice is owed them on
  their last day. If the employer willfully fails to pay on time, a "waiting time" penalty
  accrues at the worker's daily wage rate for each day the pay is late, up to a maximum of 30
  days.
