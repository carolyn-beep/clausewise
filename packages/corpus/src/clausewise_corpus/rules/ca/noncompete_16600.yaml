plain_summary: >
  In California, a contract that restrains someone from engaging in a lawful profession,
  trade, or business is void. In practice this means most non-compete clauses in employment
  agreements cannot be enforced against employees, with only narrow statutory exceptions (such
  as a true sale of a business). California has taken this position since the 1872 Civil Code;
  it is now codified at Business & Professions Code §16600 and was strengthened by SB 699,
  effective January 1, 2024.
