plain_summary: |
  The FTC's 2024 nationwide ban on most non-competes is NOT in effect. The FTC voted to stop
  defending the rule, and the rule was removed from the Code of Federal Regulations by a
  Federal Register notice dated February 12, 2026. Non-competes are therefore governed by
  state law, with case-by-case federal enforcement still possible under Section 5 of the FTC
  Act. This card records the federal status only; whether a specific non-compete is
  enforceable against you depends on your state (see the state rule cards).
