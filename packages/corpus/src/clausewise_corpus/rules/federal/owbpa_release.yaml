plain_summary: >
  The Older Workers Benefit Protection Act (OWBPA), part of the federal Age Discrimination in
  Employment Act, sets conditions for a "knowing and voluntary" waiver of age-discrimination
  claims in a severance or separation agreement. The agreement must advise the worker in
  writing to consult counsel, give at least 21 days to consider it (at least 45 days when the
  waiver is offered as part of an exit program for a group of workers), and allow at least
  7 days after signing to revoke. Group programs must also disclose the job titles and ages of
  the individuals selected and not selected for the program. A waiver that skips these steps
  may not validly release federal age-discrimination claims.
