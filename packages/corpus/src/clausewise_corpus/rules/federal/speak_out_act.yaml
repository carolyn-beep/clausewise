plain_summary: |
  The federal Speak Out Act makes a pre-dispute nondisclosure or non-disparagement clause
  unenforceable when it concerns a dispute involving sexual assault or sexual harassment.
  "Pre-dispute" means the clause was agreed to before any such dispute arose, which is the
  usual case for a clause buried in an offer letter or an onboarding NDA. It does not stop a
  worker from choosing confidentiality as part of settling a claim that has already arisen.
