[project]
name = "clausewise-mcp"
version = "0.1.0"
description = "ClauseWise MCP server (FastMCP): stdio + Streamable HTTP."
requires-python = ">=3.12"
dependencies = [
    "clausewise-core",
    "clausewise-corpus",
    "fastmcp>=2.0",
]

[project.scripts]
clausewise-mcp = "clausewise_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
clausewise-core = { workspace = true }
clausewise-corpus = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/clausewise_mcp"]
