[project]
name = "clausewise-core"
version = "0.1.0"
description = "ClauseWise core: schemas, enums, source allowlist, disclaimers."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clausewise_core"]
