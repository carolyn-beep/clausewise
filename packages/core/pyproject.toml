[project]
name = "clausewise-core"
version = "0.1.0"
description = "ClauseWise core: schemas, enums, source allowlist, disclaimers."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "rank-bm25>=0.2.2",
]

# Document parsing is optional and heavier; the analysis primitives work on plain text
# without it. Docling (layout-aware, pulls torch) is deferred to a later extra.
[project.optional-dependencies]
parse = ["pymupdf>=1.24", "python-docx>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clausewise_core"]
